<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>Trainingswoche</title>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow,noarchive">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Woche">
<meta name="theme-color" content="#7FD1C7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1F5F5A" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<style>:root{color-scheme:light dark;padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px)}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600;700&display=swap">
<style>
:root{
  --ground:#F7F4FC; --card:rgba(255,255,255,.82); --card-solid:#FFFFFF; --soft:#EFEAF8; --ink:#0A0A0F; --ink-2:#55536A; --ink-3:#9896AB;
  --line:rgba(10,10,15,.08); --btn:#0A0A0F; --btn-ink:#FFFFFF;
  --sky-a:#7FD1C7; --sky-b:#B9E6DF; --sky-c:#E2F4F1;
  --in-a:#6FCFBF; --in-b:#2BB3A3; --in-c:#8AD8FF; --in-core:#0F5F58; --in:#1B8C80; --in-soft:#E3F4F1;
  --out-a:#FFD39A; --out-b:#FFAA5C; --out-c:#FFE27A; --out-core:#A85A00; --out:#D97A12; --out-soft:#FFF0DB;
  --sp-run:#1B8C80; --sp-run-soft:#E3F4F1; --sp-bike:#D97A12; --sp-bike-soft:#FFF0DB; --sp-swim:#2F7FD6; --sp-swim-soft:#E4EEFB; --sp-str:#4A4E8F; --sp-str-soft:#E8E8F6; --sp-mob:#8E5FBF; --sp-mob-soft:#F0E8F8; --sp-rest:#9896AB; --sp-rest-soft:#EFEAF8;
  --shadow:0 1px 1px rgba(20,60,60,.03),0 14px 34px -18px rgba(20,90,90,.22);
  --sans:"Geist","Helvetica Neue",Helvetica,Arial,system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --ground:#0C0A16; --card:rgba(255,255,255,.07); --card-solid:#17142A; --soft:#1E1A33; --ink:#F6F4FF; --ink-2:#B5B1CC; --ink-3:#7C7896;
    --line:rgba(255,255,255,.10); --btn:#FFFFFF; --btn-ink:#0A0A0F;
    --sky-a:#1F5F5A; --sky-b:#173E43; --sky-c:#121C2A;
    --in-core:#0B3330; --in:#5FD0C0; --in-soft:#15302E; --out-core:#5E3100; --out:#F2A54A; --out-soft:#3A2A14;
    --sp-run:#5FD0C0; --sp-run-soft:#15302E; --sp-bike:#F2A54A; --sp-bike-soft:#3A2A14; --sp-swim:#7FB3F5; --sp-swim-soft:#17243A; --sp-str:#A3A7E8; --sp-str-soft:#22233D; --sp-mob:#C79BFF; --sp-mob-soft:#2A1F3D; --sp-rest:#7C7896; --sp-rest-soft:#1E1A33;
    --shadow:0 1px 1px rgba(0,0,0,.3),0 18px 40px -20px rgba(0,0,0,.7);
  }
}
:root[data-theme="dark"]{
  --ground:#0C0A16; --card:rgba(255,255,255,.07); --card-solid:#17142A; --soft:#1E1A33; --ink:#F6F4FF; --ink-2:#B5B1CC; --ink-3:#7C7896;
  --line:rgba(255,255,255,.10); --btn:#FFFFFF; --btn-ink:#0A0A0F;
  --sky-a:#1F5F5A; --sky-b:#173E43; --sky-c:#121C2A;
  --in-core:#0B3330; --in:#5FD0C0; --in-soft:#15302E; --out-core:#5E3100; --out:#F2A54A; --out-soft:#3A2A14;
  --sp-run:#5FD0C0; --sp-run-soft:#15302E; --sp-bike:#F2A54A; --sp-bike-soft:#3A2A14; --sp-swim:#7FB3F5; --sp-swim-soft:#17243A; --sp-str:#A3A7E8; --sp-str-soft:#22233D; --sp-mob:#C79BFF; --sp-mob-soft:#2A1F3D; --sp-rest:#7C7896; --sp-rest-soft:#1E1A33;
  --shadow:0 1px 1px rgba(0,0,0,.3),0 18px 40px -20px rgba(0,0,0,.7);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{margin:0;background:var(--ground);color:var(--ink);font-family:var(--sans);font-size:17px;line-height:1.4;-webkit-font-smoothing:antialiased;letter-spacing:-.011em;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;touch-action:manipulation;overscroll-behavior-y:none;cursor:default}
.mine,.reveal,.block p,.qs li,.prompt,textarea,input{-webkit-user-select:text;user-select:text}
.row,.practice,.resurface,.btn,.tab,.chipbtn,.pill,.x,.stepper button,.dayfield{transition:transform .16s cubic-bezier(.3,.7,.4,1),background .2s,color .2s,opacity .2s}
.row:active,.practice:active,.resurface:active{transform:scale(.975)}
.btn:active,.chipbtn:active,.tab:active,.x:active,.stepper button:active,.dayfield:active{transform:scale(.94)}
@keyframes rise{from{opacity:0;transform:translateY(14px)}}
.app.enter > *{animation:rise .42s cubic-bezier(.2,.8,.3,1) both}.app.enter > :nth-child(2){animation-delay:.04s}.app.enter > :nth-child(3){animation-delay:.08s}.app.enter > :nth-child(4){animation-delay:.12s}.app.enter > :nth-child(n+5){animation-delay:.16s}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;text-align:inherit;letter-spacing:inherit}
button:focus-visible,a:focus-visible,textarea:focus-visible,input:focus-visible,summary:focus-visible{outline:2px solid var(--in);outline-offset:3px;border-radius:12px}
a{color:inherit}
svg.i{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;flex:none}

.app{max-width:480px;margin:0 auto;padding-inline:16px;padding-block:0 140px;display:flex;flex-direction:column;gap:28px;position:relative;isolation:isolate}
.app::before{content:"";position:absolute;z-index:-1;top:-140px;left:50%;width:100vw;transform:translateX(-50%);height:720px;background:linear-gradient(180deg,var(--sky-a) 0%,var(--sky-a) 14%,var(--sky-b) 34%,var(--sky-c) 66%,var(--ground) 100%);pointer-events:none}
.app.v-mehr{--sky-a:#A9C7F2;--sky-b:#CFE0F8;--sky-c:#E8F0FC}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .app.v-mehr{--sky-a:#1E3A66;--sky-b:#172A4A;--sky-c:#121830}}
:root[data-theme="dark"] .app.v-mehr{--sky-a:#1E3A66;--sky-b:#172A4A;--sky-c:#121830}

.top{display:flex;align-items:center;justify-content:center;position:relative;padding-block:12px 0;min-height:44px}
.mark{font-size:14px;letter-spacing:.2em;text-transform:uppercase;display:flex;color:var(--ink)}
.mark b:nth-child(1){font-weight:700}.mark b:nth-child(2){font-weight:600}.mark b:nth-child(3){font-weight:500}.mark b:nth-child(4){font-weight:500}.mark b:nth-child(5){font-weight:400;opacity:.9}.mark b:nth-child(6){font-weight:400;opacity:.85}.mark b:nth-child(7){font-weight:400;opacity:.8}.mark b:nth-child(8){font-weight:400;opacity:.75}.mark b:nth-child(9){font-weight:400;opacity:.7}
.mark b:nth-child(10){font-weight:300;opacity:.65;margin-left:.5em}.mark b:nth-child(11){font-weight:300;opacity:.6}.mark b:nth-child(12){font-weight:300;opacity:.55}.mark b:nth-child(13){font-weight:300;opacity:.5}.mark b:nth-child(14){font-weight:300;opacity:.45}
.stepper{display:flex;align-items:center;justify-content:center;gap:2px;font-size:15px;color:var(--ink-2)}
.stepper span{background:var(--btn);color:var(--btn-ink);border-radius:999px;padding:8px 16px;font-weight:500;white-space:nowrap}
.stepper button{width:44px;height:44px;display:grid;place-items:center;border-radius:50%;color:var(--ink)}
.stepper button[disabled]{opacity:.22;cursor:default}
.stepper svg.i{width:20px;height:20px}

.hero{display:flex;flex-direction:column;align-items:center;text-align:center;gap:12px}
.eyebrow{font-size:14px;color:var(--ink);border:1px solid var(--ink);border-radius:8px;padding:2px 9px;max-width:100%;text-wrap:balance}
.thesis,.h1{font-weight:500;font-size:clamp(32px,9vw,40px);line-height:1.03;letter-spacing:-.042em;text-wrap:balance;margin:0;max-width:13em}
.thesis.long{font-size:clamp(24px,6.5vw,30px);letter-spacing:-.03em;max-width:17em;display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden}
.lede{margin:0;color:var(--ink-2);font-size:16px;max-width:32ch;text-wrap:pretty}
.hero .lede{color:var(--ink);opacity:.75}
.stage{width:calc(100% + 32px);margin-inline:-16px}
canvas.wave{display:block;width:100%;height:150px;color:var(--ink)}
canvas.wave.sm{height:66px;margin-top:-6px}
.segs{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;margin-top:2px}
.seg{font-size:14px;padding:7px 13px;border-radius:999px;color:var(--ink);background:var(--card);display:inline-flex;align-items:center;gap:5px;white-space:nowrap;font-variant-numeric:tabular-nums}
.seg.on{background:var(--btn);color:var(--btn-ink);font-weight:500}
.seg svg.i{width:13px;height:13px;stroke-width:2.6}
.load{font-size:15px;color:var(--ink-2);margin:0;font-variant-numeric:tabular-nums}.load b{color:var(--ink);font-weight:600}

.sec{display:flex;flex-direction:column;gap:12px}
.sec-h{display:flex;align-items:baseline;justify-content:space-between;gap:12px;padding-inline:4px}
.sec-h h2{font-weight:500;font-size:24px;letter-spacing:-.03em;margin:0}
.sec-h span{font-size:14px;color:var(--ink-3);white-space:nowrap}
.group{background:var(--card);-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px);border-radius:26px;box-shadow:var(--shadow);overflow:hidden}
.group.picks{background:none;-webkit-backdrop-filter:none;backdrop-filter:none;box-shadow:none;overflow:visible;display:flex;flex-direction:column;gap:10px}
.row{display:flex;gap:13px;padding:16px;width:100%;align-items:flex-start;background:var(--card);-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px);border-radius:26px;box-shadow:var(--shadow)}
.glyph{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;color:var(--in);flex:none;background:var(--in-soft)}
.glyph.run{background:var(--sp-run-soft);color:var(--sp-run)}.glyph.bike{background:var(--sp-bike-soft);color:var(--sp-bike)}.glyph.swim{background:var(--sp-swim-soft);color:var(--sp-swim)}.glyph.strength{background:var(--sp-str-soft);color:var(--sp-str)}.glyph.mobility{background:var(--sp-mob-soft);color:var(--sp-mob)}.glyph.rest,.glyph.other{background:var(--sp-rest-soft);color:var(--sp-rest)}
.glyph svg.i{width:20px;height:20px}
.row-b{flex:1;min-width:0;display:flex;flex-direction:column;gap:5px}
.meta{font-size:13px;color:var(--ink-3);display:flex;gap:6px;min-width:0;white-space:nowrap;font-variant-numeric:tabular-nums}
.meta > *{flex:none}.meta > :last-child{flex:0 1 auto;min-width:0;overflow:hidden;text-overflow:ellipsis}.meta > :first-child{flex:none;max-width:64%;overflow:hidden;text-overflow:ellipsis}
.meta em{font-style:normal;color:var(--ink);font-weight:500}
.meta > * + *::before{content:"·";margin-right:6px;color:var(--ink-3)}
.row h3{margin:0;font-size:18px;font-weight:500;line-height:1.2;letter-spacing:-.022em;text-wrap:pretty}
.why{margin:0;font-size:15px;line-height:1.35;color:var(--ink-2);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.tick{width:28px;height:28px;border-radius:50%;border:1.5px solid var(--ink-3);opacity:.6;flex:none;display:grid;place-items:center;margin-top:7px;color:transparent}
.row.done .tick,.row.partial .tick{background:var(--btn);border-color:var(--btn);opacity:1;color:var(--btn-ink)}
.row.done h3,.row.partial h3,.row.off h3{color:var(--ink-3)}
.row.done .why,.row.off .why{display:none}
.row.done .glyph,.row.partial .glyph,.row.off .glyph{filter:grayscale(1);opacity:.5}
.row.off .tick{border-style:dashed;opacity:.35}
.tick svg.i{width:13px;height:13px;stroke-width:2.8}
.stat{font-size:13px;color:var(--ink-2);display:inline-flex;align-items:center;gap:5px}
.stat.grey{color:var(--ink-3)}

/* day headers */
.dayh{display:flex;align-items:center;gap:10px;padding-inline:4px;min-height:44px}
.dayh h2{font-weight:500;font-size:22px;letter-spacing:-.03em;margin:0;white-space:nowrap}
.dayh.today h2{background:var(--btn);color:var(--btn-ink);border-radius:999px;padding:4px 14px;font-size:18px}
.dayh .dn{font-size:14px;color:var(--ink-3);flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dayfield{flex:none;display:inline-flex;align-items:center;gap:6px;min-height:44px;padding:6px 14px;border-radius:999px;background:var(--card);box-shadow:var(--shadow);font-size:13px;color:var(--ink-2);font-variant-numeric:tabular-nums}
.dayfield.set{color:var(--ink)}
.dayfield svg.i{width:15px;height:15px}
.dayflags{display:flex;gap:5px;flex-wrap:wrap;padding-inline:4px}
.daygap{height:4px}

/* key session card */
.practice{border-radius:30px;padding:22px 20px 20px;color:var(--ink);background:linear-gradient(160deg,var(--out-a) 0%,#FFE7C9 45%,var(--card-solid) 100%);display:flex;flex-direction:column;align-items:flex-start;text-align:left;gap:10px;width:100%;box-shadow:var(--shadow);position:relative}
.practice .meta{color:var(--ink);opacity:.72}.practice .meta em{color:var(--ink)}
.practice h3{margin:0;font-weight:500;font-size:26px;line-height:1.08;letter-spacing:-.035em;text-wrap:balance;max-width:16em}
.practice p{margin:0;font-size:15px;color:var(--ink);opacity:.75;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;max-width:40ch}
.practice .keytag{font-size:12px;letter-spacing:.14em;text-transform:uppercase;font-weight:600;color:var(--out-core)}
.practice .glyph{position:absolute;right:18px;top:18px;background:rgba(255,255,255,.6);color:var(--out-core)}
.pill{display:inline-flex;align-items:center;gap:8px;background:var(--btn);color:var(--btn-ink);font-weight:500;font-size:16px;border-radius:999px;padding:13px 24px;margin-top:4px}
.pill svg.i{width:14px;height:14px}
.practice.done,.practice.off{background:var(--card)}
.practice.done h3,.practice.done p,.practice.off h3,.practice.off p{color:var(--ink-3)}
.practice.done .keytag,.practice.off .keytag{color:var(--ink-3)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .practice:not(.done):not(.off){background:linear-gradient(160deg,#6A3D10 0%,#3D2A1E 50%,var(--card-solid) 100%)}:root:not([data-theme="light"]) .practice .glyph{background:rgba(0,0,0,.25);color:var(--out)}:root:not([data-theme="light"]) .practice .keytag{color:var(--out)}}
:root[data-theme="dark"] .practice:not(.done):not(.off){background:linear-gradient(160deg,#6A3D10 0%,#3D2A1E 50%,var(--card-solid) 100%)}
:root[data-theme="dark"] .practice .glyph{background:rgba(0,0,0,.25);color:var(--out)}:root[data-theme="dark"] .practice .keytag{color:var(--out)}

.resurface{background:var(--card);border-radius:26px;padding:16px 18px;display:flex;gap:14px;align-items:center;width:100%;box-shadow:var(--shadow)}
.resurface .glyph{background:var(--sp-rest-soft);color:var(--sp-rest)}
.resurface strong{display:block;font-size:17px;font-weight:500;letter-spacing:-.015em}
.resurface small{font-size:14px;color:var(--ink-2)}
.note{font-size:13px;color:var(--ink-3);text-align:center;margin:0;text-wrap:pretty}
.banner{font-size:14px;background:var(--card);color:var(--ink);border-radius:18px;padding:11px 16px;text-align:center}
.empty{padding:26px 22px;color:var(--ink-2);font-size:15px;text-align:center}
.empty b{display:block;color:var(--ink);font-size:17px;margin-bottom:3px;font-weight:500}

input[type=text],input[type=number],input[type=time],textarea{font:inherit;color:var(--ink);background:var(--card-solid);border:1px solid var(--line);border-radius:20px;padding:15px 18px;width:100%;letter-spacing:inherit;font-size:17px;-webkit-appearance:none;appearance:none}
input[type=text],input[type=number],input[type=time]{border-radius:999px;min-height:54px}
textarea{min-height:96px;resize:vertical;line-height:1.5}
input::placeholder,textarea::placeholder{color:var(--ink-3)}
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-size:13px;color:var(--ink-3)}
.field.inline{flex-direction:row;align-items:center;gap:10px}
.field.inline input{flex:1;min-width:0}
.field .unit{font-size:15px;color:var(--ink-2);white-space:nowrap}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:999px;padding:17px 26px;font-weight:500;font-size:17px;min-height:54px;background:var(--btn);color:var(--btn-ink);white-space:nowrap;text-decoration:none}
.btn.full{width:100%;white-space:normal;text-align:center}
.btn.ghost{background:var(--card-solid);color:var(--ink);box-shadow:inset 0 0 0 1px var(--line)}
.btn.text{background:none;color:var(--ink-2);font-weight:400;padding:10px;min-height:44px;font-size:16px}
.btn[disabled]{opacity:.4;cursor:default}
.btn-row{display:flex;gap:8px}.btn-row .btn{flex:1;padding-inline:12px;white-space:normal}
.chipbtn{display:inline-flex;align-items:center;gap:6px;font-size:15px;font-weight:500;padding:11px 20px;border-radius:999px;background:var(--soft);color:var(--ink);min-height:44px}
.chipbtn.ok,.chipbtn.on{background:var(--btn);color:var(--btn-ink)}
.chipbtn svg.i{width:15px;height:15px;stroke-width:2.6}
.chiprow{display:flex;gap:6px;flex-wrap:wrap}
.rpe{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.rpe .chipbtn{justify-content:center;padding-inline:0;font-variant-numeric:tabular-nums}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.tile{background:var(--card);border-radius:24px;padding:16px 12px;box-shadow:var(--shadow);display:flex;flex-direction:column;align-items:center;text-align:center;gap:3px;min-width:0}
.tile b{font-size:28px;font-weight:500;letter-spacing:-.04em;line-height:1.1;font-variant-numeric:tabular-nums}
.tile small{font-size:13px;color:var(--ink-2);line-height:1.3}

.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;display:flex;justify-content:center;padding:8px 18px calc(14px + env(safe-area-inset-bottom,0px));pointer-events:none}
.tabs-in{pointer-events:auto;display:flex;gap:2px;padding:6px;min-width:min(240px,70vw);justify-content:space-between;border-radius:999px;background:color-mix(in srgb,var(--card-solid) 88%,transparent);-webkit-backdrop-filter:saturate(1.6) blur(20px);backdrop-filter:saturate(1.6) blur(20px);box-shadow:0 0 0 1px var(--line),0 16px 40px -12px rgba(20,80,80,.35)}
.tab{display:flex;align-items:center;justify-content:center;gap:8px;padding:13px 22px;min-height:50px;border-radius:999px;font-size:16px;font-weight:500;color:var(--ink-3);transition:background .2s,color .2s;position:relative}
.tab > span:not(.badge){display:none}
.tab svg.i{width:24px;height:24px}
.tab[aria-current="page"]{background:var(--btn);color:var(--btn-ink);flex:1}
.tab[aria-current="page"] > span:not(.badge){display:inline}
.tab .badge{font-size:10.5px;font-weight:600;background:var(--out);color:#fff;border-radius:999px;min-width:16px;height:16px;display:grid;place-items:center;padding:0 4px;position:absolute;top:6px;right:10px}
.tab[aria-current="page"] .badge{position:static}

.backdrop{position:fixed;inset:0;z-index:30;background:rgba(10,30,30,.42);opacity:0;transition:opacity .25s;display:flex;align-items:flex-end;justify-content:center}
.backdrop.open{opacity:1}
.sheet{width:100%;max-width:480px;max-height:93%;overflow-y:auto;background:linear-gradient(180deg,var(--sky-c) 0,var(--card-solid) 190px);border-radius:34px 34px 0 0;padding:10px 20px calc(24px + env(safe-area-inset-bottom,0px));transform:translateY(100%);transition:transform .42s cubic-bezier(.2,.9,.25,1);will-change:transform;display:flex;flex-direction:column;gap:20px;overscroll-behavior:contain}
.sheet.s-out{background:linear-gradient(180deg,#FFE9CF 0,var(--card-solid) 190px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .sheet{background:linear-gradient(180deg,#173E43 0,var(--card-solid) 190px)}:root:not([data-theme="light"]) .sheet.s-out{background:linear-gradient(180deg,#4A3116 0,var(--card-solid) 190px)}}
:root[data-theme="dark"] .sheet{background:linear-gradient(180deg,#173E43 0,var(--card-solid) 190px)}

<script>

function span(s){var def=((S.rules||{}).slotDefaults||{})[s.effSlot]||["12:00","13:00"];var stt=s.effStart?tmin(s.effStart):tmin(def[0]);var en=s.effEnd?tmin(s.effEnd):(s.effStart?stt+(s.durationMin||60):Math.max(tmin(def[1]),stt+(s.durationMin||0)));var base=Math.round(parse(s.effDate).getTime()/864e5)*1440;return {start:base+stt,end:base+en,est:!s.effStart}}

  var c=me.constraints||{};if(c.notWithin48hAfter)R.push({id:"c",type:"minGapAfter",appliesTo:[me.sport].concat(me.tags||[]),after:c.notWithin48hAfter,hours:48,text:"Diese Einheit braucht 48 h Abstand nach "+c.notWithin48hAfter.join(", ")+" (Vorgabe der Einheit)."});

  if(c.endByLatest)R.push({id:"c",type:"endBy",appliesTo:[me.sport].concat(me.tags||[]),latest:c.endByLatest,text:"Diese Einheit endet laut Plan spätestens "+c.endByLatest+"."});

  R.forEach(function(r){
    if(r.type==="endBy"&&has(me,r.appliesTo)){var endDay=me_s.end-Math.round(parse(date).getTime()/864e5)*1440;if(endDay>tmin(r.latest))add(r,"Ende hier "+pad(Math.floor(endDay/60))+":"+pad(endDay%60)+"."+est)}

      if(has(o,r.appliesTo)&&has(me,r.after)){var g2=(os.start-me_s.end)/60;if(g2>=-0.01&&g2<r.hours)add(r,nameOf(o)+" läge dann nur "+Math.round(g2)+" h danach."+est)}})}
    if(r.type==="minGapBetween"){others.forEach(function(o){var os=span(o);if((has(me,r.a)&&has(o,r.b))||(has(me,r.b)&&has(o,r.a))){var g=me_s.start>=os.end?(me_s.start-os.end)/60:(os.start-me_s.end)/60;if(g<r.hours)add(r,"Abstand zu "+nameOf(o)+": "+(g<0?"überlappend":Math.round(g)+" h")+"."+est)}})}
    if(r.type==="minGapSameDay"){others.forEach(function(o){if(o.effDate!==date)return;var os=span(o);var early=me_s.start<os.start?me:o,late=early===me?o:me,es=early===me?me_s:os,lsp=late===me?me_s:os;if(has(late,r.appliesTo)&&has(early,r.after)){var g=(lsp.start-es.end)/60;if(g<r.hours)add(r,"Abstand zu "+nameOf(o)+": "+(g<0?"überlappend":Math.round(g)+" h")+"."+est)}})}

  });return out}
